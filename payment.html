<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата - Vepon VPN</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="logo">
        <img src="assets/logo.png" alt="Vepon" />
        <span>VEPON</span>
      </div>
      <nav class="nav-links">
        <a href="catalog.html">Тарифы</a>
        <a href="instructions.html">Инструкции</a>
        <a href="index.html">О сервисе</a>
      </nav>
      <div style="display: flex; gap: 10px; align-items: center;">
        <a href="account.html" class="btn primary">Профиль</a>
        <a href="cart.html" class="btn cart-btn">🛒</a>
      </div>
      <a href="support.html" style="color: #fff; text-decoration: none; font-weight: 500; margin-left: 20px;">FAQ</a>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="payment-container">
        <h1>Оплата заказа</h1>
        <p style="color: #888;">Заказ #<span id="order-id">---</span></p>

        <div style="background: rgba(255,255,255,0.03); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); margin-top: 30px;">
          <p style="margin-bottom: 20px;">Сумма к оплате: <strong id="payment-amount">0₽</strong></p>
          
          <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <p style="font-size: 14px; color: #888;">Оплата через RollyPay</p>
          </div>

          <button id="pay-button" class="btn primary" style="width: 100%;">Оплатить</button>
        </div>

        <p style="color: #666; font-size: 12px; margin-top: 30px;">
          Не закрывайте эту страницу до завершения оплаты.
        </p>
      </div>
    </div>
  </section>

  <footer>...</footer>

  <script src="js/nav-indicator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
