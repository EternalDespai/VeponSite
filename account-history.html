<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История заказов - Vepon VPN</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .order-card {
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 15px;
        border: 1px solid rgba(255,255,255,0.08);
        transition: all 0.3s ease;
    }
    .order-card:hover {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.15);
    }
    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .order-id {
        font-weight: bold;
        color: #fff;
        font-size: 16px;
    }
    .status {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
    }
    .status.paid {
        background: rgba(76, 175, 80, 0.2);
        color: #4CAF50;
    }
    .status.pending {
        background: rgba(255, 152, 0, 0.2);
        color: #FF9800;
    }
    .status.failed {
        background: rgba(244, 67, 54, 0.2);
        color: #F44336;
    }
    .order-details {
        font-size: 14px;
        color: #aaa;
        line-height: 1.6;
    }
    .order-date, .order-total, .order-paid {
        margin: 8px 0;
    }
    .order-items {
        margin: 10px 0;
        padding-left: 10px;
        border-left: 2px solid rgba(255,255,255,0.2);
    }
    .order-item {
        margin: 4px 0;
    }
    .user-info-card {
        padding: 15px;
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        margin-bottom: 20px;
    }
    .no-orders {
        text-align: center;
        padding: 60px 20px;
        background: rgba(255,255,255,0.03);
        border-radius: 15px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR (без изменений) -->
  <header class="navbar">
    <div class="container nav-inner">
      <div class="logo">
        <img src="assets/logo.png" alt="Vepon" />
        <span>VEPON</span>
      </div>
      <nav class="nav-links">
        <a href="catalog.html">Тарифы</a>
        <a href="instructions.html">Инструкции</a>
        <a href="index.html">О сервисе</a>
      </nav>
      <div style="display: flex; gap: 10px; align-items: center;">
        <a href="account.html" class="btn primary">Профиль</a>
        <a href="cart.html" class="btn cart-btn">🛒</a>
      </div>
      <a href="support.html" style="color: #fff; text-decoration: none; font-weight: 500; margin-left: 20px;">FAQ</a>
    </div>
  </header>

  <!-- ACCOUNT HISTORY -->
  <section class="section">
    <div class="container">
      
      <div class="page-header">
        <a href="account.html" style="color: #888; text-decoration: none;">← Вернуться в кабинет</a>
        <h1>История заказов</h1>
      </div>

      <div class="account-grid">
        
        <div class="account-sidebar">
          <div id="user-info" class="user-info">
            <!-- Динамически загружается -->
          </div>
          <a href="account.html" class="nav-item">Моя подписка</a>
          <a href="account-history.html" class="nav-item active">История заказов</a>
          <a href="instructions.html" class="nav-item">Инструкции</a>
          <a href="support.html" class="nav-item">Поддержка</a>
        </div>

        <div class="account-content">
          <div id="orders-container">
            <div id="no-orders-message" class="no-orders" style="display: none;">
                <p>📭 У вас пока нет заказов</p>
                <a href="catalog.html" class="btn primary" style="margin-top: 15px;">Перейти в каталог</a>
            </div>
            <div id="orders-table-body">
                <!-- Заказы загружаются динамически -->
            </div>
          </div>

          <div style="margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 15px;">
            <h3>Нужна помощь с заказом?</h3>
            <p style="color: #888;">Если у вас есть вопросы по какому-либо заказу, свяжитесь с поддержкой.</p>
            <button class="btn ghost" onclick="window.location.href='support.html'">Связаться с поддержкой</button>
          </div>
        </div>

      </div>
    </div>
  </section>

  <footer>...</footer>

  <script src="js/nav-indicator.js"></script>
  <script src="js/account-history.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
